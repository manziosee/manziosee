name: Generate GitHub metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Space Grotesk
        run: |
          mkdir -p fonts
          base=https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.18/files
          for w in 400 500 700; do
            curl -fsSL "$base/space-grotesk-latin-$w-normal.woff2" -o fonts/$w.woff2
          done

      - name: Render metrics card from the GitHub API
        env:
          # Personal token with read:user and read:org, stored as a repo secret.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          mkdir -p dist
          python3 .github/scripts/metrics_card.py manziosee fonts dist/github-metrics.svg

      - name: Push to the metrics branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: metrics
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
