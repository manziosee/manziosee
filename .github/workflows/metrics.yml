name: Generate GitHub metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Render metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: manziosee
          filename: github-metrics.svg
          output_action: none
          template: classic
          config_timezone: Africa/Kigali
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, dockerfile, shell, makefile, procfile

      - name: Collect render
        run: |
          mkdir -p dist
          cp /metrics_renders/github-metrics.svg dist/

      - name: Push to the metrics branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: metrics
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
